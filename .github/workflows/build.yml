name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle Project
        run: |
          gradle init --type basic --dsl gradle
          rm -f build.gradle
      - name: Create build.gradle
        run: |
          cat << 'EOF' > build.gradle
          plugins {
              id 'fabric-loom' version '1.7-SNAPSHOT'
              id 'maven-publish'
          }
          version = '1.0.0'
          group = 'com.yourname'
          repositories {
              maven { url "https://fabricmc.net" }
          }
          dependencies {
              minecraft "com.mojang:minecraft:1.21.1"
              mappings "net.fabricmc:yarn:1.21.1+build.3:v2"
              modImplementation "net.fabricmc:fabric-loader:0.16.5"
              modImplementation "net.fabricmc.fabric-api:fabric-api:0.106.0+1.21.1"
          }
          EOF
      - name: Setup gradle wrapper
        run: gradle wrapper
      - name: Build Mod
        run: ./gradlew build
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConfigableSigns-Jar
          path: build/libs/*.jar
